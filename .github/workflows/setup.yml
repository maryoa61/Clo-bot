name: First-Time Setup

on:
  workflow_dispatch:

jobs:
  create-kv:
    runs-on: ubuntu-latest
    name: Create KV Namespace

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Create KV Namespace
        run: |
          echo "${{ secrets.CF_API_TOKEN }}" | wrangler auth token
          echo "Creating KV Namespace..."
          wrangler kv namespace create CHAT_HISTORY --account-id="${{ secrets.CF_ACCOUNT_ID }}"

  test-telegram:
    runs-on: ubuntu-latest
    name: Test Telegram Bot Token

    steps:
      - name: Validate bot token
        run: |
          RESULT=$(curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getMe")
          echo "$RESULT" | jq .
          OK=$(echo "$RESULT" | jq -r '.ok')
          if [ "$OK" = "true" ]; then
            echo "Bot is valid!"
          else
            echo "Invalid bot token!"
            exit 1
          fi

  test-cloudflare:
    runs-on: ubuntu-latest
    name: Test Cloudflare Access

    steps:
      - name: Test Cloudflare API
        run: |
          RESULT=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}")
          SUCCESS=$(echo "$RESULT" | jq -r '.success')
          if [ "$SUCCESS" = "true" ]; then
            echo "Cloudflare access OK!"
          else
            echo "Cloudflare API failed!"
            echo "$RESULT" | jq .
            exit 1
          fi
